name: Claude Code

# Mention @claude in an issue or PR comment (or in a new issue body/title) and the
# Claude GitHub App implements the change and opens/updates a PR.
# Auth: runs on a Claude subscription (Pro/Max) via an OAuth token — generate it with
# `claude setup-token` in a Claude Code terminal, then add it to the repo as the
# CLAUDE_CODE_OAUTH_TOKEN secret (Settings -> Secrets and variables -> Actions).
# No pay-per-use API key required.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This job has write permissions, so only trusted repository users may invoke it.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create branches / commit fixes
      pull-requests: write    # open and update PRs
      issues: write           # comment back on issues
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        # actions/checkout v4, pinned to an immutable commit SHA.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # anthropics/claude-code-action v1.0.206, pinned to an immutable commit SHA.
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
